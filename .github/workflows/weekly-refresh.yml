name: Weekly refresh (Mondays 9:00 AM Central)

# The repo README already documents the cadence as "Monday 9am CDT", so this
# targets America/Chicago. GitHub cron is UTC only, and 9:00 AM Central is a
# different UTC hour in summer (14:00, CDT) than in winter (15:00, CST). Both are
# scheduled and the first step discards whichever run is not actually 9 AM local —
# so the refresh lands at 9:00 AM Central all year with no daylight-saving edits.
on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      include_multi:
        description: "Also refresh the six MULTI areas (overwrites the curated MULTI snapshot)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Is it actually 9 AM in Chicago?
        id: gate
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "09" ]; then
            echo "Local time is ${HOUR}:00 CT — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local time is ${HOUR}:00 CT — this is the off-season cron, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Refresh the trial snapshot from ClinicalTrials.gov
        if: steps.gate.outputs.run == 'true'
        env:
          INCLUDE_MULTI: ${{ inputs.include_multi }}
        run: node tools/refresh-snapshot.mjs

      - name: Rebuild tracker.html
        if: steps.gate.outputs.run == 'true'
        run: python3 tools/build.py

      - name: Commit and publish if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "decera-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neuro_snap.js tracker.html
          if git diff --cached --quiet; then
            echo "No change this week — nothing to commit."
            exit 0
          fi
          git commit -m "Weekly refresh: trial snapshot + rebuilt tracker ($(TZ=America/Chicago date '+%B %-d, %Y'))"
          git push
          echo "Pushed."
          echo "changed=true" >> "$GITHUB_ENV"

      - name: Nudge GitHub Pages to rebuild
        if: steps.gate.outputs.run == 'true' && env.changed == 'true'
        continue-on-error: true
        run: |
          # A push made with GITHUB_TOKEN does not always trigger the Pages build
          # for branch-published sites, so ask for one explicitly. Harmless if a
          # build was already queued; the job does not fail if this call is denied.
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            -o /dev/null -w "pages build request -> HTTP %{http_code}\n"

      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          {
            echo "### Decera Hub weekly refresh"
            echo ""
            echo "Ran at $(TZ=America/Chicago date '+%A, %B %-d %Y, %-I:%M %p') Central."
            echo ""
            echo "If the snapshot step failed, the previous snapshot is still in the repo —"
            echo "the live site keeps working and nothing was overwritten."
          } >> "$GITHUB_STEP_SUMMARY"
